allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true
  workerd: true
ignoredBuiltDependencies:
  - sharp
  - unrs-resolver
onlyBuiltDependencies:
  - workerd
# サプライチェーン攻撃対策: 公開から 3 日（4320 分）未満のバージョンは導入しない。
minimumReleaseAge: 4320
# 脆弱性修正のため、クールダウン期間中でも導入を許可するバージョン。
# body-parser@2.4.0（2026-10-22T11:39Z 公開）は 2026-10-25T11:39Z（JST 20:39）以降なら削除してよい。
minimumReleaseAgeExclude:
  - body-parser@2.4.0
# dev/ビルドツール経由の推移的依存（本番ランタイム非依存）の脆弱性をパッチ版へ固定。
# 複数メジャーが同居するものはメジャー指定キーで個別固定する。
overrides:
  postcss: '>=8.5.23'
  '@babel/core': '>=7.29.1'
  esbuild: '>=0.28.1'
  js-yaml: '^4.3.2'
  picomatch@2: '2.3.2'
  picomatch@4: '4.0.4'
  brace-expansion@1: '1.1.21'
  brace-expansion@5: '5.0.12'
  # miniflare（wrangler 経由）が undici / sharp を脆弱版で完全固定しているため上書き。
  undici@7: '^7.29.1'
  sharp@<0.35.4: '^0.35.4'
  # express（@opennextjs/aws 経由）の body-parser を脆弱版から引き上げる。
  body-parser@2: '^2.4.0'
  # @opennextjs/aws → @node-minify/core 経由の glob 10 系（CLI のコマンドインジェクション）。
  glob@10: '^10.5.0'
  # rehype-katex が katex@^0.16 を要求するため、直接依存と同じ修正版に揃える。
  # TODO: rehype-katex が katex 0.18.2 以上を許容したら削除する。
  katex: '^0.19.0'
