name: Deploy (preview)

# main 向け PR ごとに staging Worker（dev DB）へデプロイし、workers.dev の隠匿 URL で
# 非公開テストできるようにする。デプロイ後に URL を PR へコメントする。
on:
  pull_request:
    branches: ["main"]

# 同一 PR の連続 push は最新だけ残す（staging は共有リソースなので直列化）。
concurrency:
  group: deploy-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    # フォーク PR には secrets が渡らないため、同一リポジトリの PR のみ対象。
    if: github.event.pull_request.head.repo.full_name == github.repository
    # GitHub Environment "staging" のシークレット/変数を参照する。
    environment: staging
    steps:
      # staging 環境（HYPERDRIVE_LOCAL_CONNECTION_STRING）が未設定なら、以降を全て
      # スキップしてジョブを成功扱いにする（staging 整備前の PR を赤くしないため）。
      # 設定後は自動でプレビューが動き出す。
      - name: Guard — staging 未設定ならスキップ
        id: guard
        run: |
          if [ -z "${{ secrets.HYPERDRIVE_LOCAL_CONNECTION_STRING }}" ]; then
            echo "staging 未設定（HYPERDRIVE_LOCAL_CONNECTION_STRING 空）。プレビューをスキップします。"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout the repository
        if: steps.guard.outputs.ok == 'true'
        uses: actions/checkout@v6

      - name: Install pnpm and the packages
        if: steps.guard.outputs.ok == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: latest
          run_install: true

      # ビルド時の Hyperdrive エミュレーションは staging=dev Neon を指す。
      - name: Build (OpenNext)
        if: steps.guard.outputs.ok == 'true'
        run: pnpm exec opennextjs-cloudflare build
        env:
          CLOUDFLARE_HYPERDRIVE_LOCAL_CONNECTION_STRING_HYPERDRIVE: ${{ secrets.HYPERDRIVE_LOCAL_CONNECTION_STRING }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_STORAGE_PUBLIC_URL: ${{ vars.NEXT_PUBLIC_STORAGE_PUBLIC_URL }}

      - name: Deploy to Cloudflare (staging)
        id: deploy
        if: steps.guard.outputs.ok == 'true'
        run: |
          pnpm exec wrangler deploy --env staging | tee deploy.log
          url="$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)"
          echo "url=$url" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # プレビュー URL を PR に固定コメント（push のたびに同じコメントを更新）。
      - name: Comment preview URL
        if: steps.guard.outputs.ok == 'true' && steps.deploy.outputs.url != ''
        uses: actions/github-script@v7
        with:
          script: |
            const url = '${{ steps.deploy.outputs.url }}';
            const marker = '<!-- preview-url -->';
            const body = `${marker}\n🔎 プレビュー（非公開・dev DB）: ${url}`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.rest.issues.listComments({ owner, repo, issue_number });
            const existing = comments.data.find((c) => c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
